services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adda}
      POSTGRES_DB: ${POSTGRES_DB:-adda}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adda}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    build: ./mediamtx
    restart: unless-stopped
    environment:
      # Publish-auth webhook target. Defaults to the compose backend service;
      # when the backend runs natively (`make backend`), the root .env should
      # set MTX_AUTH_ADDRESS=http://host.docker.internal:7001/api/streams/auth
      MTX_AUTHHTTPADDRESS: ${MTX_AUTH_ADDRESS:-http://backend:7001/api/streams/auth}
    ports:
      - "${RTMP_PORT:-1935}:1935"   # RTMP ingest (OBS streams here)
      - "${HLS_PORT:-8888}:8888"    # HLS playback
      - "${WEBRTC_PORT:-8889}:8889" # WebRTC playback (HTTP/HTTPS handshake)
      - "8189:8189/udp"             # WebRTC UDP/ICE (the actual media stream)
      - "${MTX_API_PORT:-9997}:9997" # mediamtx REST API
    volumes:
      - ./recordings:/media

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adda}:${POSTGRES_PASSWORD:-adda}@postgres:5432/${POSTGRES_DB:-adda}
      REDIS_URL: redis://redis:6379/0
      MTX_API_URL: http://mediamtx:9997
      HLS_BASE_URL: http://localhost:${HLS_PORT:-8888}
      WEBRTC_BASE_URL: http://localhost:${WEBRTC_PORT:-8889}
      RECORDINGS_DIR: /recordings
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-adda <noreply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "${BACKEND_PORT:-7001}:7001"
    volumes:
      - ./recordings:/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 7001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-7001}
        NEXT_PUBLIC_HLS_BASE_URL: http://localhost:${HLS_PORT:-8888}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      # Server-side (RSC) fetches go over the docker network.
      API_SSR_URL: http://backend:7001
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  # Builds desktop installers (Linux .deb/.AppImage) — not a long-running
  # service. Run: make desktop
  # Output lands in ./dist-desktop/ on the host.
  desktop:
    build:
      context: .
      dockerfile: apps/desktop/src-tauri/Dockerfile
    profiles: ["desktop"]
    working_dir: /repo
    environment:
      # AppImage tooling can't use FUSE inside containers.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    volumes:
      - .:/repo
      - desktop_node_modules:/repo/node_modules
      - desktop_pnpm_store:/root/.local/share/pnpm/store
      - desktop_cargo_registry:/usr/local/cargo/registry
      - desktop_cargo_git:/usr/local/cargo/git
      - desktop_tauri_target:/repo/apps/desktop/src-tauri/target
      - ./dist-desktop:/out
    command: >
      sh -c "pnpm install --filter @adda/desktop... --no-frozen-lockfile &&
             pnpm --filter @adda/desktop exec tauri build --bundles deb,appimage &&
             rm -rf /out/* &&
             cp -r apps/desktop/src-tauri/target/release/bundle/deb /out/ &&
             cp -r apps/desktop/src-tauri/target/release/bundle/appimage /out/"

volumes:
  postgres_data:
  redis_data:
  desktop_node_modules:
  desktop_pnpm_store:
  desktop_cargo_registry:
  desktop_cargo_git:
  desktop_tauri_target:
