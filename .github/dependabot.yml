version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly

  # One pnpm workspace (web and site): the lockfile is at the root, so it is updated from there.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
