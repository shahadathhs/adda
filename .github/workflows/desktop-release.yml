name: Desktop Release

# Releases are cut by the code that lands on main: when a push to main
# contains a version (tauri.conf.json) that has never been released, the
# installers are built and a v<version> tag + GitHub release are created.
# Bump versions with: make release v=0.2.0  (then merge to main)

on:
  push:
    branches: [main]

jobs:
  check:
    name: Is there a new version to release?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      needed: ${{ steps.ver.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags to compare against

      - name: Compare version against existing tags
        id: ver
        run: |
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released — skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION — building release." >> "$GITHUB_STEP_SUMMARY"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # .app + .dmg
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04 # .deb + .AppImage
            args: ""
          - platform: windows-latest # .exe (NSIS) + .msi
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: v${{ needs.check.outputs.version }}
          releaseName: "adda v${{ needs.check.outputs.version }}"
          releaseBody: "Desktop installers for adda v${{ needs.check.outputs.version }}. See the assets below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
