<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- Community nodes — three circles connected by lines (the "adda" gathering concept) -->
  <g fill="none" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.95">
    <line x1="72" y1="100" x2="128" y2="168"/>
    <line x1="184" y1="100" x2="128" y2="168"/>
    <line x1="72" y1="100" x2="184" y2="100"/>
  </g>
  <!-- Stream pulse ring around center node -->
  <circle cx="128" cy="168" r="20" fill="white"/>
  <circle cx="128" cy="168" r="32" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Top-left node -->
  <circle cx="72" cy="100" r="14" fill="white" opacity="0.9"/>
  <!-- Top-right node -->
  <circle cx="184" cy="100" r="14" fill="white" opacity="0.9"/>
  <!-- Wordmark -->
  <text x="128" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="28" font-weight="800" fill="white" letter-spacing="2">adda</text>
</svg>
