[project]
name = "adda-backend"
version = "0.1.0"
description = "adda — self-hosted community platform backend"
authors = [{ name = "adda" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.391",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear,
# SIM simplify, C4 comprehensions, RUF ruff-specific.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",  # FastAPI uses Depends() in argument defaults by design.
    "UP042", # StrEnum rewrite is risky for the DB-backed CommunityRole enum.
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are intentional.
"__init__.py" = ["F401"]
