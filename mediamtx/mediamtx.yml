###############################################
# mediamtx config for adda
#
# Streamers push via RTMP:  rtmp://<host>:1935/community/<community_id>
# Viewers watch via HLS:    http://<host>:8888/community/<community_id>/index.m3u8
#                          or WebRTC:           http://<host>:8889/community/<community_id>
# The backend reads stream state from the API: http://<host>:9997 (admin/admin)
###############################################

# REST API — used by the backend to detect live streams.
api: yes
apiAddress: :9997

# Authentication: mediamtx calls the backend on every publish; the backend
# validates the community's stream key (POSTed as ?key=… on the RTMP URL).
# Reads (HLS/playback) and the control API are excluded below, so viewing a
# stream never needs a key and the key never appears in the HLS path.
authMethod: http
authHTTPAddress: http://backend:7001/api/streams/auth
authHTTPExclude:
  - action: read
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

# RTSP (not used)
rtsp: no

# RTMP — ingest from OBS / ffmpeg
rtmp: yes
rtmpAddress: :1935

# HLS — playback for the web player (hls.js)
hls: yes
hlsAddress: :8888
# Low-Latency HLS: ~1-3s glass-to-glass latency (vs ~10-30s for plain HLS).
hlsVariant: lowLatency
# Generate HLS continuously while a stream is published, so the playlist is
# already populated when a viewer joins. (Default is to mux only on first
# request, which causes the start-up delay / loading flicker.)
hlsAlwaysRemux: yes

# WebRTC — low-latency playback (used by the web player for Live)
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
# Advertise host-reachable ICE candidates. Inside Docker, mediamtx otherwise
# only gathers the container's internal IP (not reachable from the host
# browser), so the WebRTC media flow never establishes. These extra hosts let
# the browser connect over localhost.
webrtcAdditionalHosts: ["host.docker.internal", "127.0.0.1"]

# SRT (optional ingest alternative)
srt: no

###############################################
# Path defaults — recording is written to /media, which compose bind-mounts
# to ./recordings on the host (real files you can browse/back up). %path is
# "community/<id>", so recordings file per community. Segments split hourly;
# kept 30 days (set 0 to keep forever).
###############################################
pathDefaults:
  record: yes
  recordPath: /media/%path/%Y-%m-%d_%H-%M-%S
  recordFormat: fmp4
  recordSegmentDuration: 1h
  recordDeleteAfter: 720h

###############################################
# Paths — accept any community/* path dynamically.
###############################################
paths:
  all_others:
